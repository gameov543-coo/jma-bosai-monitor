name: bosai
services:
  monitor:
    build: .
    image: bosai-monitor:local
    init: true
    restart: unless-stopped
    env_file: ${BOSAI_ENV_FILE:-.env}
    environment:
      STATE_DB: /data/state.sqlite3
    volumes:
      - state:/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 60s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
volumes:
  state:
