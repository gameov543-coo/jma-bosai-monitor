name: Verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t bosai-monitor:test .
      - name: Run offline tests in the production image
        run: docker run --rm --network none -v "$PWD/tests:/app/tests:ro" -v "$PWD/.env.example:/app/.env.example:ro" bosai-monitor:test python -m unittest discover -s tests -v
      - name: Validate Compose and example configuration
        env:
          BOSAI_ENV_FILE: .env.example
        run: |
          docker compose config --quiet
          docker compose run --rm --no-deps --build monitor python -m bosai areas
